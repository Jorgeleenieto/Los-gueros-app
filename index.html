<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Los Güeros POS</title><style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#f59e0b;--ok:#16a34a;--danger:#dc2626;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff}.app{max-width:1400px;margin:auto}.top{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#fff}.nav{display:flex;gap:6px;overflow:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}.nav button{background:#f3f4f6;color:#111827;white-space:nowrap}.nav button.active{background:#111827;color:#fff}.view{padding:14px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top h2{font-size:16px}}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.prod{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.prod h4{margin:0 0 5px}.price{font-weight:800}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:9px;padding:9px;background:#fff}.pill{padding:4px 8px;border-radius:999px;font-size:12px;background:#e5e7eb}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.danger{background:var(--danger)}.secondary{background:#e5e7eb;color:#111827}.accent{background:var(--accent);color:#111827}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{background:#e5e7eb;color:#111827}.tab.sel{background:var(--accent)}.cartline{border-bottom:1px solid var(--line);padding:10px 0}.qty button{padding:4px 8px}.total{font-size:22px;font-weight:900}.tablegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.tablebox{padding:15px;border-radius:12px;border:1px solid var(--line);background:#fff}.tablebox.ocupada{border-color:#f59e0b;background:#fffbeb}.tablebox.cuenta{border-color:#2563eb;background:#eff6ff}.tablebox.libre{border-color:#16a34a;background:#f0fdf4}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:24px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal>div{background:#fff;border-radius:15px;padding:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.checklist{display:flex;gap:8px;flex-wrap:wrap}.checklist label{border:1px solid var(--line);padding:7px 9px;border-radius:9px}.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:30}.print{display:none}@media print{body>*{display:none!important}.print{display:block!important}}
</style></head><body><div class="app" id="app"></div><div id="modal"></div><div id="toast"></div><div class="print" id="print"></div><script>

function fresh(){let p={};seedProducts.forEach((x,i)=>p['p'+i]={id:'p'+i,name:x[0],cat:x[1],price:x[2],stock:99,active:true,sabores:x[3]||[]});let g={};seedGuisos.forEach((n,i)=>g['g'+i]={id:'g'+i,name:n,stock:99,active:true});return {settings:{business:'Los Güeros',phone:'529991938170',logo:'',open:true},products:p,guisos:g,orders:[],sales:[],tables:Array.from({length:10},(_,i)=>({id:i+1,status:'Libre',items:[],customer:''})),zones:{Cerca:10,'Distancia media':20,'Distancia lejos':25},combos:[],users:{admin:{role:'Administrador',pin:'2468'}},cash:0};}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||fresh();
if(db.products?.p8){db.products.p8.sabores=['Lima limón','Limonada fresa','Horchata','Jamaica'];db.products.p8.cat='Bebidas';}
let cart=[], userLocation=null, mode='Domicilio', cat='Todos', role='Cliente', selectedTable=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function money(n){return '$'+Number(n).toFixed(2)} function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))} function toast(s){let e=document.getElementById('toast');e.textContent=s;e.className='toast';setTimeout(()=>e.className='',2200)}
function nav(){return `<div class=top><div class=brand><img class=logo src="${db.settings.logo||''}" onerror="this.style.display='none'"><div><b>${esc(db.settings.business)}</b><div class=muted style="color:#d1d5db">POS V8 · ${db.settings.open?'Abierto':'Cerrado'}</div></div></div><button class=accent onclick="login()">${role==='Cliente'?'Acceso POS':role}</button></div><div class=nav>${[['cliente','🛒 Pedido'],['pos','💰 Caja/POS'],['cocina','👨‍🍳 Cocina'],['mesas','🪑 Mesas'],['inventario','📦 Inventario'],['reportes','📊 Reportes'],['config','⚙️ Config']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
let view='cliente'; function go(v){if(v!=='cliente'&&role==='Cliente')return login();view=v;render()}
function render(){document.getElementById('app').innerHTML=nav()+`<main class=view>${view==='cliente'?client():view==='pos'?pos():view==='cocina'?kitchen():view==='mesas'?tables():view==='inventario'?inventory():view==='reportes'?reports():config()}</main>`}
function client(){let cats=['Todos',...new Set(Object.values(db.products).map(p=>p.cat))];return `<div class=grid><section><div class=card><div class=between><h3>Nuevo pedido</h3><span class="pill ${db.settings.open?'ok':'bad'}">${db.settings.open?'Recibiendo pedidos':'Cerrado'}</span></div><div class=tabs>${['Domicilio','Recoger','Mesa'].map(m=>`<button class="tab ${mode===m?'sel':''}" onclick="mode='${m}';render()">${m}</button>`).join('')}</div>${mode==='Mesa'?`<div class=field><label>Mesa</label><select onchange="selectedTable=this.value"><option value="">Selecciona</option>${db.tables.map(t=>`<option value="${t.id}">Mesa ${t.id}</option>`).join('')}</select></div>`:''}${mode==='Domicilio'?`<div class=field><label>Zona de entrega</label><select id=zone>${Object.entries(db.zones).map(([z,f])=>`<option>${z}</option>`).join('')}</select></div>`:''}</div><div class=card><div class=between><h3>Menú</h3><input style="max-width:190px" placeholder="Buscar..." oninput="search=this.value;render()"></div><div class=tabs>${cats.map(c=>`<button class="tab ${cat===c?'sel':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class=cards>${productsHTML()}</div></div></section>${cartHTML()}</div>`}
let search=''; function productsHTML(){return Object.values(db.products).filter(p=>p.active&&p.stock>0&&(cat==='Todos'||p.cat===cat)&&p.name.toLowerCase().includes(search.toLowerCase())).map(p=>`<div class=prod><h4>${esc(p.name)}</h4><div class=between><span class=price>${money(p.price)}</span><span class=pill>Stock ${p.stock}</span></div><button class=accent style="margin-top:8px;width:100%" onclick="customize('${p.id}')">Agregar</button></div>`).join('')||'<p class=muted>No hay productos disponibles.</p>'}
function cartHTML(){let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),fee=mode==='Domicilio'?Number(document.getElementById('zone')?.value?db.zones[document.getElementById('zone').value]:Object.values(db.zones)[0]||0):0;return `<aside class=card><div class=between><h3>🛒 Cuenta</h3><button class=secondary onclick="cart=[];render()">Vaciar</button></div>${cart.map((x,i)=>`<div class=cartline><div class=between><b>${esc(x.name)}</b><b>${money(x.price*x.qty)}</b></div><div class=muted>${x.obs?esc(x.obs):'Sin observaciones'}</div><div class=row qty><button class=secondary onclick="q(${i},-1)">−</button><span>${x.qty}</span><button class=secondary onclick="q(${i},1)">+</button></div></div>`).join('')||'<p class=muted>Agrega productos al pedido.</p>'}<hr><div class=between><span>Subtotal</span><b>${money(sub)}</b></div>${mode==='Domicilio'?`<div class=between><span>Envío</span><b>${money(fee)}</b></div>`:''}<div class=between><span class=total>Total</span><span class=total>${money(sub+fee)}</span></div><div class=field><label>👤 Nombre y dirección</label><input id=cname placeholder="Nombre del cliente"><input id=caddress placeholder="Calle, número, colonia y referencias"></div><div class=field><label>📞 Teléfono y ubicación</label><input id=cphone placeholder="Teléfono del cliente" inputmode="tel"><button type="button" class=secondary onclick="getLocation()">📍 Compartir ubicación actual</button><div id=locmsg class=muted>La ubicación GPS se agregará al pedido.</div></div><div class=field><label>💳 Forma de pago</label><select id=pay onchange="paymentInfo()"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Combinado</option></select><div id=payinfo></div></div><button class=accent style="width:100%;font-weight:800" onclick="sendOrder()">Confirmar pedido</button></aside>`}
function customize(id){let p=db.products[id];let flavor=p.sabores?.length?`<div class=field><label>🥤 Sabor del agua <b>(obligatorio)</b></label><select id=ms><option value="">Selecciona un sabor</option>${p.sabores.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`:'';let guiso=p.guiso?`<div class=field><label>Guiso</label><select id=mg><option>Sin especificar</option>${Object.values(db.guisos).filter(g=>g.active&&g.stock>0).map(g=>`<option>${esc(g.name)}</option>`).join('')}</select></div>`:'';document.getElementById('modal').innerHTML=`<div class=modal><div><h3>${esc(p.name)} · ${money(p.price)}</h3>${flavor}${guiso}<div class=field><label>Ingredientes a quitar</label><div class=checklist>${['Sin cebolla','Sin tomate','Sin aguacate','Sin repollo','Sin mayonesa'].map(x=>`<label><input type=checkbox value="${x}"> ${x}</label>`).join('')}</div></div><div class=field><label>Otra observación</label><textarea id=mo rows=3 placeholder="Ej. poco picante, bien dorado..."></textarea></div><div class=row><button onclick="add('${id}')">Agregar</button><button class=secondary onclick="closeModal()">Cancelar</button></div></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''} function add(id){let p=db.products[id], checks=[...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(x=>x.value), g=document.getElementById('mg')?.value||'', sabor=document.getElementById('ms')?.value||'';if(p.sabores?.length&&!sabor)return toast('Selecciona el sabor del agua');let o=[g!=='Sin especificar'?g:'',sabor,...checks,document.getElementById('mo').value].filter(Boolean).join(', ');let z=cart.find(x=>x.id===id&&x.obs===o);if(z)z.qty++;else cart.push({id,name:p.name,price:p.price,qty:1,obs:o,sabor});closeModal();render()}
function q(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render()}
async function getLocation(){const e=document.getElementById('locmsg');if(!window.isSecureContext){if(e)e.textContent='⚠️ La ubicación requiere HTTPS. Abre la app desde su enlace seguro de GitHub Pages.';return}if(!navigator.geolocation){if(e)e.textContent='⚠️ Este navegador no permite ubicación.';return}if(e)e.textContent='📍 Solicitando permiso de ubicación...';try{if(navigator.permissions?.query){const r=await navigator.permissions.query({name:'geolocation'});if(r.state==='denied'){if(e)e.textContent='⚠️ El permiso de ubicación está bloqueado para este sitio. En Chrome: 🔒 > Permisos > Ubicación > Permitir, y vuelve a intentarlo.';return}}}catch(_){}navigator.geolocation.getCurrentPosition(p=>{userLocation={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:Math.round(p.coords.accuracy)};if(e)e.textContent='✅ Ubicación obtenida correctamente.'},err=>{let m='⚠️ No se pudo obtener la ubicación.';if(err.code===1)m='⚠️ Permiso de ubicación denegado. Activa Ubicación para este sitio en Chrome y vuelve a intentarlo.';else if(err.code===2)m='⚠️ No se pudo determinar tu ubicación. Activa el GPS/Ubicación del teléfono e inténtalo de nuevo.';else if(err.code===3)m='⚠️ La solicitud de ubicación tardó demasiado. Activa el GPS e inténtalo de nuevo.';if(e)e.textContent=m},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function paymentInfo(){let p=document.getElementById('pay')?.value,e=document.getElementById('payinfo');if(!e)return;if(p==='Transferencia'||p==='Combinado')e.innerHTML=`<div class=card style="margin:8px 0 0;padding:10px;background:#fffbeb"><b>📲 Datos para transferencia</b><div class=muted style="margin-top:6px">BanCoppel<br>Titular: <b>Jorge Lee</b><br>Cuenta: <b>4169 1604 4634 3676</b><br><br>Mercado Pago<br>Titular: <b>Jorge Lee</b><br>Cuenta: <b>5428 7853 7210 7994</b><br><br>📱 Envía tu comprobante al WhatsApp de Los Güeros.</div></div>`;else e.innerHTML='';}
function sendOrder(){if(!cart.length)return toast('Agrega al menos un producto');if(!db.settings.open)return toast('El negocio está cerrado');let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),zone=mode==='Domicilio'?(document.getElementById('zone')?.value||Object.keys(db.zones)[0]):'',fee=mode==='Domicilio'?db.zones[zone]:0,customer=document.getElementById('cname')?.value.trim()||'',address=document.getElementById('caddress')?.value.trim()||'',phone=document.getElementById('cphone')?.value.trim()||'',payment=document.getElementById('pay').value;if(!customer)return toast('Escribe el nombre del cliente');if(mode==='Domicilio'&&!address)return toast('Escribe la dirección del domicilio');if(!phone)return toast('Escribe el teléfono del cliente');if(mode==='Mesa'&&!selectedTable)return toast('Selecciona una mesa');let o={id:'PED-'+Date.now(),created:new Date().toISOString(),mode,table:mode==='Mesa'?selectedTable:'',customer,phone,address,location:userLocation,zone,fee,items:JSON.parse(JSON.stringify(cart)),subtotal:sub,total:sub+fee,payment,status:'Nuevo'};db.orders.push(o);save();let msg=`*LOS GÜEROS*\nPedido ${o.id}\n\nNOMBRE Y DIRECCIÓN: ${customer}${address?'\n'+address:''}\nTELÉFONO: ${phone}`;if(userLocation)msg+=`\nUBICACIÓN: https://maps.google.com/?q=${userLocation.lat},${userLocation.lon}`;if(mode==='Domicilio')msg+=`\nDOMICILIO: ${zone} — ${money(fee)}`;if(mode==='Mesa')msg+=`\nMESA: ${selectedTable}`;msg+=`\n\n${o.items.map(x=>`${x.qty} x ${x.name}${x.obs?' — '+x.obs:''}`).join('\n')}\n\nSubtotal: ${money(o.subtotal)}\nEnvío: ${money(o.fee)}\nTOTAL: ${money(o.total)}\nFORMA DE PAGO: ${o.payment}`;if(payment==='Transferencia'||payment==='Combinado')msg+=`\n\nDATOS PARA TRANSFERENCIA\nBanCoppel — Titular: Jorge Lee — Cuenta: 4169 1604 4634 3676\nMercado Pago — Titular: Jorge Lee — Cuenta: 5428 7853 7210 7994\nEnviar comprobante al WhatsApp de Los Güeros.`;window.open('https://wa.me/'+db.settings.phone+'?text='+encodeURIComponent(msg),'_blank');cart=[];userLocation=null;toast('Pedido registrado y enviado');render()}
function pos(){return `<div class=statgrid><div class=stat>Pedidos abiertos<br><b>${db.orders.filter(o=>!['Entregado','Cancelado'].includes(o.status)).length}</b></div><div class=stat>Ventas hoy<br><b>${money(todaySales())}</b></div><div class=stat>Caja<br><b>${money(db.cash)}</b></div></div><div class=card><h3>Pedidos</h3>${ordersTable(true)}</div>`}
function ordersTable(all=false){return `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>ID</th><th>Hora</th><th>Modo</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr>${db.orders.slice().reverse().slice(0,60).map(o=>`<tr><td>${o.id}</td><td>${new Date(o.created).toLocaleTimeString()}</td><td>${o.mode}${o.table?' '+o.table:''}</td><td>${money(o.total)}</td><td>${o.payment}</td><td><span class=pill>${o.status}</span></td><td><button class=secondary onclick="orderActions('${o.id}')">Ver</button></td></tr>`).join('')}</table></div>`}
function orderActions(id){let o=db.orders.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class=modal><div><h3>${o.id}</h3><p>${o.customer||'Cliente'} · ${o.mode}${o.table?' · Mesa '+o.table:''}</p>${o.items.map(x=>`<div class=cartline><b>${x.qty} x ${esc(x.name)}</b><div>${esc(x.obs||'')}</div></div>`).join('')}<h3>${money(o.total)}</h3><div class=row>${['Nuevo','En preparación','Listo','Entregado','Cancelado'].map(s=>`<button onclick="setStatus('${o.id}','${s}')">${s}</button>`).join('')}</div><br><div class=row><button class=accent onclick="printTicket('${o.id}')">🖨️ Ticket</button><button class=secondary onclick="closeModal()">Cerrar</button></div></div></div>`}
function setStatus(id,s){let o=db.orders.find(x=>x.id===id);o.status=s;if(s==='Entregado'&&!o._sold){o._sold=true;db.sales.push({...o,soldAt:new Date().toISOString()});db.cash+=o.total;o.items.forEach(i=>{if(db.products[i.id])db.products[i.id].stock=Math.max(0,db.products[i.id].stock-i.qty)});if(o.mode==='Mesa'&&o.table){let t=db.tables.find(x=>x.id==o.table);if(t)t.status='Libre'}}save();closeModal();render()}
function kitchen(){let active=db.orders.filter(o=>!['Entregado','Cancelado'].includes(o.status));return `<div class=card><div class=between><h3>👨‍🍳 Comandas de cocina</h3><button onclick="printKitchen()">🖨️ Imprimir comandas</button></div>${active.map(o=>`<div class=card"><div class=between><b>${o.id} · ${o.mode}${o.table?' · Mesa '+o.table:''}</b><span class="pill ${o.status==='Listo'?'ok':'warn'}">${o.status}</span></div>${o.items.map(x=>`<div class=cartline><b>${x.qty} × ${esc(x.name)}</b><div class=muted>${esc(x.obs||'')}</div></div>`).join('')}<div class=row><button onclick="setStatus('${o.id}','En preparación')">Preparar</button><button onclick="setStatus('${o.id}','Listo')">Listo</button></div></div>`).join('')||'<p>No hay comandas pendientes.</p>'}</div>`}
function tables(){return `<div class=card><div class=between><h3>🪑 Mesas</h3><button class=accent onclick="mode='Mesa';view='cliente';render()">Nuevo pedido en mesa</button></div><div class=tablegrid>${db.tables.map(t=>`<div class="tablebox ${t.status.toLowerCase().replaceAll(' ','')}"><h3>Mesa ${t.id}</h3><span class=pill>${t.status}</span><p>${t.items.length} productos</p><button class=secondary onclick="tableOrder(${t.id})">Abrir cuenta</button></div>`).join('')}</div></div>`}

function inventory(){return `<div class=card><h3>📦 Inventario y disponibilidad</h3><h4>Productos</h4>${Object.values(db.products).map(p=>`<div class=between style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}</span><div class=row><input type=number min=0 value="${p.stock}" style="width:75px" onchange="setStock('p','${p.id}',this.value)"><button class="${p.active?'ok':'bad'}" onclick="toggleActive('p','${p.id}')">${p.active?'Disponible':'Agotado'}</button></div></div>`).join('')}<h4>Guisos</h4>${Object.values(db.guisos).map(g=>`<div class=between style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(g.name)}</span><div class=row><input type=number min=0 value="${g.stock}" style="width:75px" onchange="setStock('g','${g.id}',this.value)"><button class="${g.active?'ok':'bad'}" onclick="toggleActive('g','${g.id}')">${g.active?'Disponible':'Agotado'}</button></div></div>`).join('')}</div>`}
function setStock(t,id,v){db[t==='p'?'products':'guisos'][id].stock=Number(v);save()} function toggleActive(t,id){db[t==='p'?'products':'guisos'][id].active=!db[t==='p'?'products':'guisos'][id].active;save();render()}
function reports(){let today=db.sales.filter(s=>s.soldAt?.slice(0,10)===new Date().toISOString().slice(0,10));let total=today.reduce((a,x)=>a+x.total,0),cash=today.filter(x=>x.payment==='Efectivo').reduce((a,x)=>a+x.total,0),trans=today.filter(x=>x.payment==='Transferencia').reduce((a,x)=>a+x.total,0),card=today.filter(x=>x.payment==='Tarjeta').reduce((a,x)=>a+x.total,0);return `<div class=statgrid><div class=stat>Ventas hoy<br><b>${money(total)}</b></div><div class=stat>Efectivo<br><b>${money(cash)}</b></div><div class=stat>Transferencia<br><b>${money(trans)}</b></div><div class=stat>Tarjeta<br><b>${money(card)}</b></div></div><div class=card><h3>📊 Historial</h3>${ordersTable()}</div><div class=card><h3>💾 Respaldo</h3><button onclick="backup()">Exportar datos</button> <button class=secondary onclick="resetDemo()">Restaurar datos iniciales</button></div>`}
function todaySales(){return db.sales.filter(s=>s.soldAt?.slice(0,10)===new Date().toISOString().slice(0,10)).reduce((a,x)=>a+x.total,0)}
function config(){return `<div class=card><h3>⚙️ Configuración</h3><div class=field><label>Nombre del negocio</label><input id=bs value="${esc(db.settings.business)}"></div><div class=field><label>WhatsApp de pedidos</label><input id=bw value="${esc(db.settings.phone)}"></div><div class=field><label>Logo</label><input type=file accept=image/* onchange="logo(this)"></div><div class=field><label>Estado</label><button onclick="db.settings.open=!db.settings.open;save();render()">${db.settings.open?'🟢 Abierto':'🔴 Cerrado'}</button></div><h4>Tarifas de entrega</h4>${Object.entries(db.zones).map(([z,f])=>`<div class=row><input value="${z}" disabled><input type=number value="${f}" onchange="db.zones['${z}']=Number(this.value);save()"></div>`).join('')}<br><button class=accent onclick="db.settings.business=document.getElementById('bs').value;db.settings.phone=document.getElementById('bw').value;save();toast('Guardado');render()">Guardar cambios</button><p class=muted>PIN inicial de administrador: 2468. Cámbialo antes de usar el sistema en producción.</p></div>`}
function login(){document.getElementById('modal').innerHTML=`<div class=modal><div><h3>Acceso POS</h3><div class=field><label>PIN</label><input id=pin type=password inputmode=numeric></div><div class=field><label>Rol</label><select id=rl><option>Administrador</option><option>Caja</option><option>Cocina</option><option>Mesero</option></select></div><div class=row><button onclick="auth()">Entrar</button><button class=secondary onclick="closeModal()">Cancelar</button></div></div></div>`}function auth(){if(document.getElementById('pin').value!==db.users.admin.pin)return toast('PIN incorrecto');role=document.getElementById('rl').value;closeModal();render()}
function logo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();render()};r.readAsDataURL(f)}
function printTicket(id){let o=db.orders.find(x=>x.id===id);document.getElementById('print').innerHTML=`<div style="width:72mm;font-family:monospace"><h2 style="text-align:center">LOS GÜEROS</h2><div>${o.id}<br>${new Date(o.created).toLocaleString()}<br>${o.mode}${o.table?' · Mesa '+o.table:''}</div><hr>${o.items.map(x=>`<div>${x.qty} x ${esc(x.name)}<br>${esc(x.obs||'')}</div>`).join('<hr>')}<hr><b>TOTAL ${money(o.total)}</b><br>Pago: ${o.payment}</div>`;window.print()}
function printKitchen(){let a=db.orders.filter(o=>!['Entregado','Cancelado'].includes(o.status));document.getElementById('print').innerHTML=`<div style="width:72mm;font-family:monospace"><h2>COMANDA</h2>${a.map(o=>`<hr><b>${o.id} · ${o.mode}${o.table?' · MESA '+o.table:''}</b><br>${o.items.map(x=>`${x.qty} x ${esc(x.name)}<br>  ${esc(x.obs||'')}`).join('<br>')}`).join('')}</div>`;window.print()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='los-gueros-respaldo.json';a.click()}function resetDemo(){if(confirm('¿Restaurar datos iniciales?')){db=fresh();save();render()}}
render();

</script></body></html>
